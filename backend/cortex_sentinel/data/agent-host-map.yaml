  Multica 执行者 id → 机器名。scripts/multica_notify_bridge.py 写派工登记 host 时查这张表。
  机器名必须能跟哨兵本机比对：哨兵拿 host 跟 scutil --get ComputerName 和 hostname 比。
  查不到映射一律不写 host，绝对不许回落成本机名。
  读不出机器的执行者不要写进来。执行者凭据不许进本文件。

