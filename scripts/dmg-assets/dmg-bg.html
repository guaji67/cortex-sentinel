<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;box-sizing:border-box}
  html,body{width:660px;height:400px;overflow:hidden}
  body{font-family:-apple-system,'PingFang SC',sans-serif;
    background:radial-gradient(880px 380px at 50% -30%,#16203A 0%,transparent 60%),#0B1020;
    color:#E6EAF5;position:relative}
  .brand{position:absolute;top:30px;left:0;right:0;text-align:center;
    font-size:22px;font-weight:700;color:#DDE4F2;letter-spacing:.06em}
  /* Cortex哨兵.app(180,170) → Applications(480,170) */
  .arrow{position:absolute;top:162px;left:248px;width:164px;height:16px;display:flex;align-items:center;opacity:.9}
  .arrow .ln{height:2.5px;flex:1;background:linear-gradient(90deg,rgba(76,141,255,.25),#4C8DFF);border-radius:3px}
  .arrow .hd{width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:12px solid #4C8DFF;margin-left:-1px}
  .hint{position:absolute;left:34px;right:34px;bottom:28px;text-align:center;color:#8A94AC;
    font-size:12px;line-height:1.6;letter-spacing:.01em}
  .hint strong{color:#4C8DFF;font-weight:600}
</style></head><body>
  <div class="brand">Cortex 哨兵</div>
  <div class="arrow"><div class="ln"></div><div class="hd"></div></div>
  <div class="hint">首次安装：把左侧 Cortex 哨兵 拖到右侧“应用程序”<br><strong>升级交给应用内自动更新，不用手动覆盖</strong></div>
</body></html>
